[project]
name = "brain-tumor-agent"
version = "0.1.0"
description = "Active diagnostic reasoning agent for 3D brain tumor MRI"
authors = [{ name = "Kelvin" }]
requires-python = ">=3.10,<3.13"
readme = "README.md"

dependencies = [
    # LLM API clients
    "anthropic>=0.40.0",
    "openai>=1.50.0",

    # Local inference (Qwen3-14B 4-bit + vLLM)
    "torch>=2.3.0",
    "transformers>=4.51.0",
    "accelerate>=0.33.0",
    "peft>=0.12.0",
    "bitsandbytes>=0.43.0",
    "vllm>=0.6.0; sys_platform == 'linux'",
    "unsloth>=2024.10; sys_platform == 'linux'",

    # Schema and config
    "pydantic>=2.5.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # Medical imaging
    "nibabel>=5.2.0",
    "SimpleITK>=2.3.0",
    "scikit-image>=0.22.0",
    "monai>=1.3.0",

    # Numerical
    "numpy>=1.26.0,<2.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",

    # Visualization & tracking
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "wandb>=0.17.0",

    # Utilities
    "tenacity>=8.2.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]
rl = [
    "trl>=0.11.0",
    "datasets>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
